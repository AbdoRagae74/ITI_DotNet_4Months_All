<div class="container d-flex justify-content-center align-items-center" >
  <div class="card shadow-sm p-4 rounded-4" style="width: 100%; max-width: 420px;">
    <h2 class="text-center text-primary mb-4">Login to Your Account</h2>

    <form>
      <div class="mb-3">
        <label for="exampleInputEmail1" class="form-label fw-semibold">Email address</label>
        <input
          type="email"
          class="form-control rounded-3"
          id="exampleInputEmail1"
          placeholder="Enter your email"
        />
      </div>

      <div class="mb-3">
        <label for="exampleInputPassword1" class="form-label fw-semibold">Password</label>
        <input
          type="password"
          class="form-control rounded-3"
          id="exampleInputPassword1"
          placeholder="Enter your password"
        />
      </div>

      <div class="d-grid">
        <button type="submit" class="btn btn-success rounded-3">Log In</button>
      </div>

      <p class="text-center mt-4">
        Don't have an account?
        <a [routerLink]="['/account/register']" class="text-decoration-none text-primary fw-medium">
          Sign up
        </a>
      </p>
    </form>
  </div>
</div>
